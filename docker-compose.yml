services:
  agent:
    image: ubuntu:22.04
    platform: linux/amd64
    environment:
      - GITHUB_REPO=${GITHUB_REPO}
      - GIT_COMMIT_HASH=${GIT_COMMIT_HASH:-main}
      - UPDATE_CODE=true
      - AGENT_SALT=${AGENT_SALT}
      - RPC_URL=${RPC_URL}
      - CHAIN_ID=${CHAIN_ID}
      - REDPILL_API_KEY=${REDPILL_API_KEY}
    ports:
      - "80:80"
    restart: unless-stopped
    command: >
      /bin/bash -c "apt-get update && apt-get install -y git python3 python3-pip curl && mkdir -p /app && cd /app && git clone $$GITHUB_REPO . && pip3 install -r requirements.txt && bash entrypoint.sh"
